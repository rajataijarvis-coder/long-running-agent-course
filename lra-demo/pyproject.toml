[project]
name = "lra-demo"
version = "0.1.0"
description = "Demo project for Long-Running Agent Systems course"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "temporalio>=1.6.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "langfuse>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lra"]
